x-ollama-common: &ollama-common
  image: ollama/ollama@sha256:57d60e686821ea81a7748a3ec8141308c8b8f95b27105713954abf7a6529e700
  restart: unless-stopped
  environment:
    OLLAMA_HOST: 0.0.0.0:11434
    OLLAMA_NUM_PARALLEL: "1"
  healthcheck:
    test: ["CMD", "ollama", "list"]
    interval: 10s
    timeout: 5s
    retries: 12

services:
  ollama-gpu0:
    <<: *ollama-common
    container_name: lunar-futures-ollama-gpu0
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-gpu0-models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_0_UUID:?set GPU_0_UUID}"]
              capabilities: [gpu]

  ollama-gpu1:
